[project]
name = "social-analytics"
version = "1.0.0"
description = "Análisis de una red social ficticia con Pandas: laboratorio de trabajo colaborativo con Git y GitHub"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Equipo Social Analytics (IABD)" }]
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.2",
]

[project.scripts]
social-analytics = "social_analytics.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbdime>=4.0",
    "nbformat>=5.10",
    "nbstripout>=0.8",
    "pytest>=8.0",
]
lab = [
    "jupyterlab>=4.2",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "notebook: ejecuta notebooks completos con nbclient (más lento)",
]
filterwarnings = [
    # Aviso inofensivo de pyzmq en Windows al lanzar kernels de Jupyter.
    "ignore:Proactor event loop does not implement add_reader:RuntimeWarning",
]
